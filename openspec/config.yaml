schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

context: |
  openspec/specs/ hold desired repository behavior: behavioral requirements and testable scenarios. Manifests, tests,
  and code own exhaustive data operators don't see. openspec/contracts/ hold machine-checked invariants (see its
  README). openspec/observations/ describe vendor behavior with the qualifiers in its README; harness or static
  inference is not a requirement or confirmed vendor behavior. Keep all three current rather than append-only, state
  each rule once, describe behavior rather than diffs, and give paths only where they help traceability.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  specs:
    - Keep only repository-controlled observable behavior; put implementation mechanics in design, code, or tests.
    - State shared behavior once instead of repeating it for each firmware, slicer, entrypoint, or operation.
    - Reference installer/package.yaml and openspec/contracts for exhaustive values, hashes, variants, command order, and forbidden patterns.
    - Use the fewest scenarios that distinguish materially different success, safety, ownership, or failure outcomes.
