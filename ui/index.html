<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f15" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Valve Oil UI</title>
    <script>
      // Follow the device unless this browser has an explicit choice, before the first paint.
      let theme
      try {
        theme = localStorage.getItem('vo-theme')
      } catch {}
      const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0f15' : '#ffffff')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
